<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova5 雙手臂分揀控制台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><strong>Nova5 雙手臂分揀</strong><span id="connection">連線中</span></div>
    <div class="clock">模擬時間 <output id="sim-time">0.000 s</output></div>
  </header>
  <main>
    <section class="controls" aria-label="演示控制">
      <div class="button-row">
        <button id="resume" class="primary" type="button">開始 / 繼續</button>
        <button id="pause" type="button">暫停</button>
        <button id="restart" type="button">重新播放</button>
        <button id="open-mujoco" type="button">開啟 / 顯示 MuJoCo</button>
        <button id="apply-demo-settings" class="primary apply-settings" type="submit" form="settings">套用設定並重播</button>
      </div>
      <output id="settings-status" class="settings-status" aria-live="polite"></output>
      <p id="viewer-status" class="viewer-status">正在確認 MuJoCo 視窗</p>
      <form id="settings">
        <h1>演示設定</h1>
        <label>隨機種子 Seed<input name="seed" type="number" step="1" required></label>
        <label>演示速度<input name="simulation_speed" type="number" min="0.1" max="4" step="0.1" required></label>
        <label>皮帶速度 (m/s)<input name="belt_speed_mps" type="number" min="0.02" max="0.5" step="0.01" required></label>
        <label>投料間隔 (s)<input name="feed_interval_s" type="number" min="1" max="30" step="0.1" required></label>
        <label>每批投料物品數<input name="feed_batch_size" type="number" min="1" max="10" step="1" required></label>
        <label>投料橫向隨機範圍 (m)<input name="feed_lateral_spread_m" type="number" min="0.05" max="0.18" step="0.01" required></label>
        <label>最大線上物件數<input name="max_active_parts" type="number" min="1" max="10" step="1" required></label>
        <label>碰撞警戒外擴距離 (m)<input name="warning_margin_m" type="number" min="0.02" max="0.30" step="0.01" required></label>
        <h1>演算法</h1>
        <label>協調方法
          <select name="algorithm" id="algorithm">
            <option value="bc_jsp">BC-JSP：貝式集中聯合策略規劃</option>
            <option value="deadline_first" disabled>Deadline-first：即將支援</option>
            <option value="hungarian" disabled>Hungarian：即將支援</option>
            <option value="fuzzy" disabled>Fuzzy：即將支援</option>
          </select>
        </label>
        <h1>中央協調器</h1>
        <label>滾動視窗 (s)<input name="horizon_s" type="number" min="0.5" max="30" step="0.1" required></label>
        <label>雙臂並行加分<input name="parallel_bonus" type="number" min="0.1" max="20" step="0.1" required></label>
        <label>預估取件速度 (m/s)<input name="pick_speed_mps" type="number" min="0.1" max="2" step="0.05" required></label>
        <label>初始週期估計 (s)<input name="fixed_cycle_s" type="number" min="0.1" max="20" step="0.1" required></label>
        <label>期限權重<input name="urgency_weight" type="number" min="0.1" max="20" step="0.1" required></label>
        <label>成功率權重<input name="success_weight" type="number" min="0.1" max="20" step="0.1" required></label>
        <label>移動距離權重<input name="travel_weight" type="number" min="0.01" max="10" step="0.01" required></label>
        <button class="primary" type="submit">套用全部設定並重播</button>
      </form>
    </section>
    <section class="monitor" aria-label="即時狀態">
      <div class="metrics">
        <div><span>已投料</span><strong id="spawned">0</strong></div>
        <div><span>已放置</span><strong id="placed">0</strong></div>
        <div><span>漏件</span><strong id="missed">0</strong></div>
      </div>
      <section class="panel"><h2>執行回饋</h2><div id="feedback" class="rows"></div></section>
      <section class="panel"><h2>手臂任務</h2><div id="missions" class="rows"></div><p id="deferred"></p><p id="preflight"></p></section>
      <section class="panel"><h2>目前演算法</h2><div id="algorithm-name"></div><div id="joint-plan" class="rows"></div></section>
      <section class="panel"><h2>最新中央派工</h2><div id="assignments" class="rows"></div><details><summary>拒絕候選</summary><pre id="rejected"></pre></details></section>
      <section class="panel"><h2>事件紀錄</h2><ol id="events"></ol></section>
      <p class="hint">關閉 MuJoCo 後可由左側重新開啟同一場演示；MuJoCo 視窗按 <kbd>R</kbd> 也能重播。</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
